services:
  app:
    image: node:24-alpine
    container_name: next_ims_app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3000"
    volumes:
      - ./:/app
      # Kept in the container: Alpine needs its own native binaries (SWC, Tailwind,
      # lightningcss), and nothing is written to the host as root.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      # Server-side calls run inside this container, where localhost is not the host.
      # The browser keeps using NEXT_PUBLIC_API_URL from .env.
      API_URL: http://host.docker.internal:3001/api
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  next_cache:
