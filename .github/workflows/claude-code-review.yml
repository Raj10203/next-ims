name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs, CI files and lockfile-only pushes do not trigger a review.
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".claude/**"
      - "package-lock.json"

# A new push to the same PR cancels the review still running for the old commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Both jobs fail as a warning (a red check), never as a merge block: they are not
# required checks. "Claude review" fails unless the verdict is ✅.
jobs:
  # Rewrites the bot's block of the PR description for the head commit, so the
  # review below checks the code against an up-to-date description.
  describe:
    name: PR description
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            This repo is the Next.js frontend of the IMS app; the API is a separate
            NestJS repo (nest-ims).

            ## Instructions
            1. Load the `pr-description` skill with the Skill tool (if that fails, Read
               `.claude/skills/pr-description/SKILL.md`). Follow its Gather steps, rules
               and template, with `origin/${{ github.event.pull_request.base.ref }}` as the
               base. Skip its "Local output" section; the Output below replaces it.
            2. The current body, for context only: `gh pr view ${{ github.event.pull_request.number }} --json body --jq .body`.

            ## Output
            Write to /tmp/pr-block.md (never inside the repo) exactly this, with the
            skill's template filled in between the two comment lines and the end marker:

            <!-- auto-description:start -->
            <!-- Generated for commit <first 7 characters of HEAD COMMIT> by the "PR description" job. Write your own notes outside this block: it is replaced on every push. -->

            <the filled-in template, from "## Summary" to the end of "## Release notes">

            <!-- auto-description:end -->

            The next step puts it into the description and keeps the author's text. Do
            not edit the PR and do not comment. Never change the working tree, index, HEAD
            or branches. A denied command is never a reason to stop: use an allowed tool
            and always write the file.
          # Skill loads .claude/skills/pr-description (the rules and template live there).
          # Write is only for /tmp/pr-block.md; the PR itself is edited by the next step.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Skill,Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' \
            "$EXECUTION_FILE" || true

      # Swaps the bot's block in the description, keeping the author's text; the
      # first time, the old body moves below the block under "Author notes".
      - name: Update the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SHA:0:7}"
          if ! grep -q "Generated for commit $short" /tmp/pr-block.md 2>/dev/null \
            || ! grep -q '<!-- auto-description:end -->' /tmp/pr-block.md; then
            echo "::error::Claude did not write a description block for $short. See 'Show denied tool calls'."
            exit 1
          fi
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/pr-old.md
          python3 - <<'PY'
          import re
          block = open('/tmp/pr-block.md').read().strip()
          block = block[block.index('<!-- auto-description:start -->'):]
          block = block[:block.index('<!-- auto-description:end -->') + len('<!-- auto-description:end -->')]
          old = open('/tmp/pr-old.md').read().strip()
          pattern = re.compile(r'<!-- auto-description:start -->.*?<!-- auto-description:end -->', re.S)
          if pattern.search(old):
              body = pattern.sub(lambda _: block, old, count=1)
          elif old:
              body = f'{block}\n\n## Author notes\n\n{old}'
          else:
              body = block
          open('/tmp/pr-body.md', 'w').write(body + '\n')
          PY
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
          echo "Description updated for $short"

  review:
    name: Claude review
    # After the description, even if writing it failed.
    needs: describe
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only so the reviewer can read the Next.js docs that ship with the installed
      # version (node_modules/next/dist/docs/, see AGENTS.md). Nothing is built or run.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            You are a senior frontend reviewer for this Next.js 16 (App Router, Cache
            Components) / React 19 / Tailwind CSS 4 app. It is the responsive UI of the
            IMS system; the API is a separate NestJS repo (nest-ims) that it calls over HTTP.

            ## Context (read first)
            1. CLAUDE.md: the project rules (Server Components by default, mobile-first
               layout, the API contract, where tokens may live, comment style).
            2. AGENTS.md: this Next.js version differs from your training data. Before
               flagging or approving any Next.js API, file convention, config option or
               caching behaviour, check it in `node_modules/next/dist/docs/` (Grep it).
               Never call something wrong only because older Next.js did it differently.
            3. The PR description: `gh pr view ${{ github.event.pull_request.number }} --json title,body`.
               The block between `<!-- auto-description:start -->` and `end` was written
               from this diff by a bot just before you; text outside it is the author's.

            ## Review
            Review the WHOLE pull request every time, not only the latest commit, and
            ignore earlier review comments.
            For a large PR, list the files first (`gh pr diff ${{ github.event.pull_request.number }} --name-only`),
            then read the diff file by file with
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- <path>`. Skip
            `package-lock.json`.
            1. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Use
               `git diff`, `git log` and `git show` against `origin/${{ github.event.pull_request.base.ref }}`
               and read each changed file around the change before commenting on it.
            2. Intent: does the code match the description? Check its "Screens",
               "Backend dependency" and "Release notes" sections against the diff in both
               directions. A missing PR-specific release step (env variable, a
               `NEXT_PUBLIC_*` value needed at build time, backend release first, CORS or
               `APP_URL` change, a moved URL) is Important; routine deploy steps (install,
               build, start) must not be listed there. Other gaps in the description are
               Minor, never a reason to block the merge. The Screens table is short on
               purpose: flag a wrong or missing row, never a row for lacking detail.
            3. Correctness: logic errors, edge cases, unhandled promise rejections,
               missing loading, empty and error states for API calls, stale or wrongly
               shared cached data (`use cache`, per-user data cached for everyone),
               hydration mismatches, effects with missing cleanup or wrong dependencies,
               race conditions between requests.
            4. Security: secrets or server-only values reaching the client bundle (a
               non-`NEXT_PUBLIC_` env read in a Client Component, server-only modules
               imported from `'use client'` files), access or refresh tokens in
               localStorage or other JS-readable storage, `dangerouslySetInnerHTML` or
               URLs built from user input, open redirects, Server Functions or Route
               Handlers that skip the auth check, the UI hiding something the API
               would still allow (fine) versus the UI being the only check (not fine).
            5. Server/Client boundary: `'use client'` placed higher than needed (pulls a
               whole subtree into the browser), non-serializable props crossing the
               boundary, browser APIs used during server rendering.
            6. Responsive and accessible: the layout must work from a 360px-wide phone
               up. Flag fixed widths or tables that force horizontal page scroll on
               phones, hover-only actions, tap targets that are clearly too small,
               inputs without labels, images without `alt`, clickable `div`s instead of
               buttons or links, and focus that is lost or trapped. Only flag what you
               can point to in the diff.
            7. API contract: compare every request and response the PR touches with
               CLAUDE.md's API notes (`/api` prefix, bearer token, the error shape
               `{ statusCode, error, message, errors: [{ path, message }] }`, 401 vs 403
               email-not-verified vs 404 out-of-scope, 429). A screen that would break
               on a real API response is a finding.
            8. Impact on existing code: for every changed or removed export, component
               prop, hook, API helper, type and route, find ALL its usages with Grep
               (including files the PR does not touch) and read each caller. A caller
               this PR breaks is this PR's issue; name the caller's `path:line` in the
               finding. Name every new or changed backend call in "Merge notes" (it is
               not a finding by itself).
            9. Tests: if the repo has a test setup, new non-trivial logic (data mapping,
               validation, auth handling) without a test.
            Do not flag formatting or lint issues (Prettier and ESLint cover them), or
            problems in code the PR does not touch, unless this PR's change breaks it
            (one line at most otherwise, if serious).

            ## Calibration (most important)
            A clean PR is a normal, expected result. Do not search for something to say:
            "No issues found." with a ✅ verdict is the right answer for most good PRs.
            - Critical or Important only when you can state a concrete failure: these
              inputs, this screen size or this sequence of events -> this wrong result,
              and you confirmed it by reading the code path end to end. If you cannot
              write that sentence, it is Minor or it is dropped.
            - Do not report: hypotheticals ("could", "might", "consider"), design or
              styling preferences, alternative approaches, missing tests for trivial
              code, or "add an end-to-end test" suggestions.
            - Do not re-raise a trade-off the code already explains in a comment or the
              PR description already declares as intended. Disagreeing with a documented
              decision is not a finding.
            - Minor: at most 3 items, only ones a maintainer would actually act on.
            - Before posting, re-check every Critical and Important finding against the
              code once more. Drop it, or move it to Minor, if it does not hold up.

            ## Read-only
            Never change the working tree, index, HEAD or branches: no checkout, commit,
            stash or file edits in the repo.

            ## Always post
            Only the allowed tools work; anything else is denied. A denied command is
            never a reason to stop: use an allowed tool instead (Read, Grep, the git and
            gh commands above), and always finish by posting the comment.

            ## Output
            Write the comment in Markdown to /tmp/review.md (never inside the repo), then
            post it as ONE new comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md`.
            Never edit or delete earlier comments. Use exactly this structure, with a blank
            line between every heading, paragraph and list:

            ## Claude review

            Reviewed commit `<first 7 characters of HEAD COMMIT>` · **Risk:** low | medium | high

            ### Issues

            **Critical (must fix)**: a verified bug, security hole, leaked secret or
            broken screen in normal use.

            **Important (should fix)**: a verified failure in a realistic edge case (error
            or empty state, phone-width layout, slow or failed request, a caller in this
            repo broken by the change, a mismatch with the API contract), or risky new
            logic with no test at all when the repo has a test setup.

            **Minor**: small improvements worth a mention. They never block the merge.

            Under each bucket, one bullet per finding: `path/file.tsx:line`, what is wrong,
            why it matters, and the fix. Omit empty buckets. If there are none at all,
            write "No issues found." under the Issues heading.

            ### Merge notes

            2 to 4 bullets for the human reviewer: the riskiest parts to look at, screens
            worth checking on a phone, and anything to do before or after merging (env
            vars to set before the build, backend release to ship first, CORS or
            `APP_URL` to update). Write "Nothing extra." if there is none.

            ### Verdict

            Exactly one of these three lines (copy it as written), followed by 1 to 2
            sentences of reasoning. It is decided only by the buckets, never by gut feeling:
            - `✅ **Mergeable**` when there are no Critical and no Important items (Minor items are fine).
            - `⚠️ **Mergeable with fixes**` when there is at least one Important item and no Critical.
            - `❌ **Not mergeable**` when there is at least one Critical item.

            Risk follows the same rule: low for ✅, medium for ⚠️, high for ❌. This job
            fails on ⚠️ and ❌ (a warning on the PR), so never soften a verified
            Important or Critical finding to get a ✅, and never invent one.

            Rules: most severe first. No praise, no summary of what the PR does, no vague
            findings like "improve error handling". Always give a verdict.
          # Write is only for /tmp/review.md; the prompt forbids writing in the repo.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

      # The full transcript stays off (public repo: it can contain secrets); the
      # denied commands alone explain a review that stopped early.
      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' \
            "$EXECUTION_FILE" || true

      # Fails (a warning on the PR, not a merge block) unless the review for this
      # commit says ✅. The action itself reports success even when Claude posted nothing.
      - name: Check the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SHA:0:7}"
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            | jq -r --arg marker "Reviewed commit \`$short\`" \
              '[.comments[] | select(.body | contains($marker))] | last | .body // ""')
          if [ -z "$body" ]; then
            echo "::error::Claude finished without posting a review for $short. See 'Show denied tool calls'."
            exit 1
          fi
          risk=$(printf '%s\n' "$body" | grep -oE '\*\*Risk:\*\* (low|medium|high)' | head -n1 | awk '{print $2}')
          case "$risk" in
            low)
              echo "✅ Mergeable (risk low) for $short" ;;
            medium)
              echo "::error::Claude review: ⚠️ Mergeable with fixes (risk medium) for $short. Fix the Important items and push to re-run."
              exit 1 ;;
            high)
              echo "::error::Claude review: ❌ Not mergeable (risk high) for $short. Fix the Critical items and push to re-run."
              exit 1 ;;
            *)
              echo "::error::Could not read the risk level from the review of $short."
              exit 1 ;;
          esac
